<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Résultats Laboratoire</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>RESULTAT D'EXAMEN</h1>
<div class="info-patient">
  <div class="ligne">
    <label for="">N° Labo: <input type="text" id="labo" ></label> 
  </div>

  <div class="ligne">
    <label for="">Date : <input type="date" style="width: 150px;" id="dateInput"></label> <br>
  </div>

  <div class="ligne">
    <label for="">Nom : <input id="nom"  type="text"style="width: 200px;" ></label>
  </div>

  <div class="ligne">
    <label for=""> Age : <input type="number" id="age" oninput="afficher()" style="width: 50px;"> <span>ans</span></label> <br>
  </div>

  <div class="ligne">
    <label for="">Prénom: <input id="prenom" type="text" style="width: 200px;"></label>
  </div>

  <div class="ligne">
    <label for="">Sexe : <select name="sexe" id="sexe" onchange="afficher()">
      <option value="homme">H</option>
      <option value="femme">F</option>
    </select></label> <br>
  </div>
 
</div>

<div class="ligne" id="prescripteur">
  <label for="">Médecin prescripteur: <input type="text" style="width: 200px;margin-top: 10px;"></label>
</div>
<div class="top-bar">
  <strong>Choisir domaine :</strong><br>

  <label><input type="checkbox" value="Hémogramme" onchange="afficher()"> Hémogramme(NFS)</label>
  <label><input type="checkbox" value="Groupage" id="groupageCheck" onchange="afficher()"> Groupage sanguin</label>
  <label><input type="checkbox" value="Biochimie" onchange="afficher()"> Biochimie</label>
  <label><input type="checkbox" value="Sérologie" onchange="afficher()"> Sérologie</label>
  <label><input type="checkbox" value="Parasitologie" onchange="afficher()"> Parasitologie</label>
  <label><input type="checkbox" value="Bandelette" id="bandeletteCheck" onchange="afficher()">Bandelette Urinaire</label>
</div>

<br>

<table border="1" width="100%" id="table1">
  <thead>
    <tr>
      <th>Analyse</th>
      <th>Résultat</th>
      <th>Valeur normale</th>
      <th>Unité</th>
    </tr>
  </thead>

  <tbody id="tbody"></tbody>
</table>

<div id="groupage-container" style="margin-top: 2px;display: none;">
  <h3>GROUPAGE SANGUIN</h3>

  <label>
    Groupe:
    <select id="groupe" onchange="colorGroupage()">
      <option value="">--Choisir--</option>
      <option>A</option>
      <option>B</option>
      <option>AB</option>
      <option>O</option>
    </select>
  </label>

  <label>
    Rhésus: 
    <select id="rhesus" onchange="colorGroupage()">
      <option value="">--Choisir--</option>
      <option value="negatif">Négatif</option>
      <option value="positif">Positif</option>
    </select>
  </label>
</div>

<div id="parasitologie-container">
</div>


<br>

<br>

<!-- CONTAINER BANDELETTE URINAIRE -->
<div id="bandelette-container" style="display: none; margin-top: 15px;">

   <h3 style="text-align: center;">Bandelette Urinaire</h3>
    <table border="1">
        <thead>
            <tr>
            <th>Leucocyte</th>
            <th>Nitrite</th>
            <th>Urobilinogène</th>
            <th>Protéine</th>
            <th>pH</th>
            <th>Sang</th>
            <th>Densité</th>
            <th>Acétone</th>
            <th>Bilirubine</th>
            <th>Sucre</th>
        </tr>
        </thead>
        <tbody style="text-align: center;">
         <tr>
          <!-- Leucocyte -->
            <td>
                <select name="" id="leucocyte" onchange="verifierBandelette(this)" >
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- Nitrite -->
            <td>
                <select name="" id="nitrite" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- urobilinogène -->
            <td>
                <select name="" id="urobilinogene" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- proteine -->
            <td>
                <select name="" id="proteine" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- pH -->
            <td>
                <select name="" id="pH" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="">5.0</option>
                    <option value="">6.0</option>
                    <option value="">6.5</option>
                    <option value="">7.0</option>
                    <option value="">7.5</option>
                    <option value="">8.0</option>
                    <option value="">8.5</option>
                </select>
            </td>
            <!-- sang -->
            <td>
                <select name="" id="sang" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- densité -->
            <td>
                <select name="" id="densite" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="">1.000</option>
                    <option value="">1.005</option>
                    <option value="">1.010</option>
                    <option value="">1.015</option>
                    <option value="">1.020</option>
                    <option value="">1.025</option>
                    <option value="">1.030</option>
                </select>
            </td>
            <!-- acetone -->
            <td>
                <select name="" id="acetone" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- bilirubine -->
            <td>
                <select name="" id="bilirubine" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                </select>
            </td>
            <!-- sucre -->
            <td>
                <select name="" id="sucre" onchange="verifierBandelette(this)">
                    <option value="">--Choisir--</option>
                    <option value="negatif">Négatif</option>
                    <option value="trace">Trace</option>
                    <option value="un">+</option>
                    <option value="deux">++</option>
                    <option value="trois">+++</option>
                    <option value="quatres">++++</option>
                </select>
            </td>
        </tr>
        </tbody>
       
    </table>
</div>
<div id="obsBlock">
  <label style="color: red;">Observation:</label> <br>
  <textarea id="observation" placeholder="Observation"></textarea>
</div>

<br>

<button onclick="exportPDF()" class="no-print"> <span class="emoji"> 📄 </span> Exporter PDF</button>

<div id="renseignements-verso">
  <h1>Résultats d'analyses</h1>

  <div class="verso">
    <p>N° Labo : <span id="v-labo"></span></p>
    <p>Date : <span id="v-date"></span></p>
    <p>Nom : <span id="v-nom"></span></p>
    <p>Prénom : <span id="v-prenom"></span></p>
  </div>
 
</div>

<script src="script.js"></script>

</body>
</html>
